<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4-Quadrant CO2 & Vortex Sonification</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1a1d22;
      --border: #2e333b;
      --text: #e6e9ef;
      --muted: #8b949e;
      --accent: #50ffa0;
      --cyan: #00d2ff;
      --danger: #ff5a5a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      user-select: none;
    }
    .app-container {
      width: 100%;
      max-width: 1140px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #16181c;
      border-bottom: 1px solid var(--border);
    }
    button {
      background: #262b33;
      color: var(--text);
      border: 1px solid #3a414d;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { background: #323842; }
    button.active {
      background: rgba(80, 255, 160, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }
    button.muted {
      background: rgba(255, 90, 90, 0.15);
      border-color: var(--danger);
      color: var(--danger);
    }
    .scrubber-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 180px;
    }
    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
    }
    #scrubber { flex: 1; }
    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1.33fr 1fr;
      gap: 2px;
      background: var(--border);
    }
    @media (max-width: 860px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    .video-stack {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--border);
    }
    .canvas-box {
      position: relative;
      background: #000;
      width: 100%;
      line-height: 0;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    .dashboard-wrap {
      background: #161616;
      display: flex;
      flex-direction: column;
    }
    #chartCanvas {
      width: 100%;
      height: 100%;
    }
    .hint-bar {
      padding: 6px 14px;
      font-size: 11px;
      color: var(--muted);
      background: #131518;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hidden-media {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      pointer-events: none;
      overflow: hidden;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="toolbar">
    <button id="btnPlay">▶ Play</button>
    <div class="scrubber-wrap">
      <input type="range" id="scrubber" min="0" max="100" step="0.01" value="0" />
      <span id="timeLabel" style="font-size:12px; font-variant-numeric:tabular-nums; color:#aaa;">0:00</span>
    </div>
    <button id="btnAll" title="Hear all 4 quadrants (F)">All 4 Quads</button>
    <button id="btnMuteV" title="Toggle Vortex Instrument (V)">Vortex [V]</button>
    <button id="btnMuteC" title="Toggle CO2 Pad (C)">CO2 Pad [C]</button>
    <button id="btnMuteAll" title="Mute Master Audio (M)">Mute [M]</button>
    <div class="vol-wrap">
      <span>Vol</span>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.7" style="width:70px;" />
    </div>
  </div>

  <div class="main-grid">
    <div class="video-stack">
      <div class="canvas-box" id="boxConc" title="Click quadrant to solo">
        <canvas id="canvasConc"></canvas>
      </div>
      <div class="canvas-box" id="boxMotion" title="Click quadrant to solo">
        <canvas id="canvasMotion"></canvas>
      </div>
    </div>
    <div class="dashboard-wrap">
      <canvas id="chartCanvas" width="480" height="723"></canvas>
    </div>
  </div>

  <div class="hint-bar">
    <span>Click any map quadrant to solo (1–4) • Click "All 4 Quads" (F) for full stereo chord</span>
    <span id="statusText">Loading assets...</span>
  </div>
</div>

<video id="vidConc" class="hidden-media" src="input.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>
<video id="vidMotion" class="hidden-media" src="motion.mp4" muted playsinline preload="auto" crossorigin="anonymous"></video>

<script>
// ============================================================================
// MUSICAL & VISUAL CONSTANTS
// ============================================================================
const C_ROOT = 130.8128;
const PENTA = [1.0, 9 / 8, 5 / 4, 3 / 2, 5 / 3];
const PENTA_NAMES = ["C", "D", "E", "G", "A"];

function ladderFreq(k) {
  return C_ROOT * PENTA[k % 5] * Math.pow(2.0, Math.floor(k / 5));
}
function ladderName(k) {
  return `${PENTA_NAMES[k % 5]}${3 + Math.floor(k / 5)}`;
}

const QUAD_META = [
  { name: "Q1: NW (Top-Left)",     short: "Q1 NW", pan: -0.75, start: 6, conc_start: 2 },
  { name: "Q2: NE (Top-Right)",    short: "Q2 NE", pan:  0.75, start: 7, conc_start: 3 },
  { name: "Q3: SW (Bottom-Left)",  short: "Q3 SW", pan: -0.75, start: 3, conc_start: 0 },
  { name: "Q4: SE (Bottom-Right)", short: "Q4 SE", pan:  0.75, start: 0, conc_start: 1 },
];

const N_BINS = 10;
const CONC_FREQS = QUAD_META.map(m => Array.from({length: N_BINS}, (_, b) => ladderFreq(m.conc_start + b)));
const CONC_NAMES = QUAD_META.map(m => Array.from({length: N_BINS}, (_, b) => ladderName(m.conc_start + b)));

const CONC_DETUNE = 0.0018;
const BREATH_HZ = Array.from({length: N_BINS}, (_, i) => 0.08 + (0.22 - 0.08) * (i / (N_BINS - 1)));
const CONC_GAIN = 0.4; // You can safely adjust this value (e.g. 0.3 to 0.6)
const VORT_GAIN = 0.30;
const PAD_NOTE_RMS = 0.41;
const VU_DECAY = 0.35;
const DB_MIN = -60.0, DB_MAX = -12.0;
const CONC_FLASH_SENS = 0.10;
const CONC_FLASH_DECAY = 0.9;
const LIT_REL = 0.40;
const GLOW = 0.75;
const ROLL_SEC = 12.0;
const RUNG_LO = 3, RUNG_HI = 17;
const QUAD_COLORS = ["#3cc8ff", "#ffaa3c", "#8cff6e", "#e66eff"];
const MALLET_PARTIALS = [[1.0, 1.00, 1.00], [4.0, 0.35, 0.35], [6.0, 0.12, 0.18]];
const SMOOTH_SEC_C = 0.05;
const SMOOTH_STAGES = 5;

const VIRIDIS_STOPS = [
  [68, 1, 84], [72, 40, 120], [62, 74, 137], [49, 104, 142], [38, 130, 142],
  [31, 158, 137], [53, 183, 121], [109, 205, 89], [180, 222, 44], [253, 231, 37]
];

// ============================================================================
// APPLICATION STATE
// ============================================================================
let sonData = null;
let selectedQuad = 0;
let muted = false;
let muteV = false;
let muteC = false;
let masterVol = 0.7;
let hasStarted = false;

let s_c = Array.from({length: 4}, () => new Float32Array(N_BINS));
let c_stages = Array.from({length: SMOOTH_STAGES}, () => Array.from({length: 4}, () => new Float32Array(N_BINS)));
let flash_c = Array.from({length: 4}, () => new Float32Array(N_BINS));
let vu_c = Array.from({length: 4}, () => new Float32Array(N_BINS));
let strikeLog = [];
let lastFrameIdx = -1;
let lastAnimTime = performance.now();
let isScrubbing = false;

// ============================================================================
// WEB AUDIO SYNTHESIS ENGINE
// ============================================================================
class WebSonifier {
  constructor() {
    this.ctx = null;
    this.initialized = false;
    this.padVoices = [];
    this.quadGains = [];
    this.vortBus = null;
    this.concBus = null;
  }

  init() {
    if (this.initialized) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AudioCtx();

    this.dryGain = this.ctx.createGain();
    this.wetGain = this.ctx.createGain();
    this.dryGain.gain.value = 0.0;
    this.wetGain.gain.value = 1.0;

    const convolver = this.ctx.createConvolver();
    convolver.buffer = this.createBlurIR(1.0);

    this.scaleGain = this.ctx.createGain();
    this.scaleGain.gain.value = masterVol * 0.85;

    const shaper = this.ctx.createWaveShaper();
    shaper.curve = this.makeTanhCurve();
    shaper.oversample = "2x";

    this.vortBus = this.ctx.createGain();
    this.concBus = this.ctx.createGain();

    this.vortBus.connect(this.dryGain);
    this.vortBus.connect(convolver);
    this.concBus.connect(this.dryGain);
    this.concBus.connect(convolver);

    convolver.connect(this.wetGain);
    this.dryGain.connect(this.scaleGain);
    this.wetGain.connect(this.scaleGain);
    this.scaleGain.connect(shaper);
    shaper.connect(this.ctx.destination);

    for (let q = 0; q < 4; q++) {
      const qGain = this.ctx.createGain();
      qGain.gain.value = 1.0;
      const panner = this.ctx.createStereoPanner();
      panner.pan.value = 0.35 * QUAD_META[q].pan;
      qGain.connect(panner);
      panner.connect(this.concBus);
      this.quadGains.push(qGain);

      const binList = [];
      for (let b = 0; b < N_BINS; b++) {
        const freq = CONC_FREQS[q][b];
        const noteGain = this.ctx.createGain();
        noteGain.gain.value = 0.0;

        const breathGain = this.ctx.createGain();
        breathGain.gain.value = 0.8;
        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = BREATH_HZ[b];
        const lfoDepth = this.ctx.createGain();
        lfoDepth.gain.value = 0.2;
        lfo.connect(lfoDepth);
        lfoDepth.connect(breathGain.gain);
        lfo.start();

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        osc1.type = "sine";
        osc2.type = "sine";
        osc1.frequency.value = freq * (1.0 - CONC_DETUNE);
        osc2.frequency.value = freq * (1.0 + CONC_DETUNE);

        const mixHalf = this.ctx.createGain();
        mixHalf.gain.value = 0.5 * CONC_GAIN;

        osc1.connect(mixHalf);
        osc2.connect(mixHalf);
        mixHalf.connect(breathGain);
        breathGain.connect(noteGain);
        noteGain.connect(qGain);

        osc1.start();
        osc2.start();
        binList.push(noteGain);
      }
      this.padVoices.push(binList);
    }

    this.initialized = true;
  }

  createBlurIR(seconds) {
    const sr = this.ctx.sampleRate;
    const len = Math.floor(seconds * sr);
    const buf = this.ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      let sumSq = 0;
      for (let i = 0; i < len; i++) {
        const t = i / sr;
        const env = (1.0 - Math.exp(-t / 0.02)) * Math.exp(-t / (seconds / 6.9));
        const u1 = Math.max(1e-7, Math.random());
        const u2 = Math.random();
        const z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
        data[i] = z * env;
        sumSq += data[i] * data[i];
      }
      const norm = Math.sqrt(sumSq) || 1;
      for (let i = 0; i < len; i++) data[i] /= norm;
    }
    return buf;
  }

  makeTanhCurve() {
    const n = 4096;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = Math.tanh(x * 1.5);
    }
    return curve;
  }

  updateMixState(isPlaying) {
    if (!this.initialized) return;
    const now = this.ctx.currentTime;
    const scale = muted ? 0.0 : masterVol * (selectedQuad === -1 ? 0.55 : 0.85);
    this.scaleGain.gain.setTargetAtTime(scale, now, 0.02);
    this.vortBus.gain.setTargetAtTime(muteV ? 0.0 : 1.0, now, 0.02);
    this.concBus.gain.setTargetAtTime((muteC || !isPlaying) ? 0.0 : 1.0, now, 0.015);

    for (let q = 0; q < 4; q++) {
      const active = (selectedQuad === -1 || selectedQuad === q) ? 1.0 : 0.0;
      this.quadGains[q].gain.setTargetAtTime(active, now, 0.03);
    }
  }

  updatePadLevels(smoothedLevels) {
    if (!this.initialized) return;
    const now = this.ctx.currentTime;
    for (let q = 0; q < 4; q++) {
      for (let b = 0; b < N_BINS; b++) {
        this.padVoices[q][b].gain.setTargetAtTime(smoothedLevels[q][b], now, 0.02);
      }
    }
  }

  strikeVortex(ev) {
    if (!this.initialized || muted || muteV || !hasStarted) return;
    if (selectedQuad !== -1 && ev.quad !== selectedQuad) return;

    const now = this.ctx.currentTime;
    const panner = this.ctx.createStereoPanner();
    panner.pan.value = ev.pan;
    panner.connect(this.vortBus);

    const voiceGain = this.ctx.createGain();
    voiceGain.gain.setValueAtTime(0.0001, now);
    voiceGain.gain.linearRampToValueAtTime(ev.vel * VORT_GAIN, now + 0.002);
    voiceGain.gain.exponentialRampToValueAtTime(0.0001, now + ev.decay * 5.0);
    voiceGain.connect(panner);

    for (const [ratio, w_p, d_f] of MALLET_PARTIALS) {
      const lvl = ratio === 1.0 ? w_p : w_p * (0.35 + 0.65 * ev.vel);
      const osc = this.ctx.createOscillator();
      const pGain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = ev.freq * ratio;

      const dur = ev.decay * d_f * 6.0;
      pGain.gain.setValueAtTime(lvl, now);
      pGain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      osc.connect(pGain);
      pGain.connect(voiceGain);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    const clickDur = 0.015;
    const clickBuf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * clickDur), this.ctx.sampleRate);
    const cData = clickBuf.getChannelData(0);
    for (let i = 0; i < cData.length; i++) {
      const t = i / this.ctx.sampleRate;
      cData[i] = (Math.random() * 2 - 1) * Math.exp(-t / 0.004) * 0.15 * ev.vel;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = clickBuf;
    noise.connect(voiceGain);
    noise.start(now);
  }
}

const synth = new WebSonifier();

// ============================================================================
// DOM & VIDEO SYNCHRONIZATION
// ============================================================================
const vidConc = document.getElementById("vidConc");
const vidMotion = document.getElementById("vidMotion");
const canvasConc = document.getElementById("canvasConc");
const canvasMotion = document.getElementById("canvasMotion");
const chartCanvas = document.getElementById("chartCanvas");
const ctxConc = canvasConc.getContext("2d", { alpha: false });
const ctxMotion = canvasMotion.getContext("2d", { alpha: false });
const ctxChart = chartCanvas.getContext("2d", { alpha: false });

const btnPlay = document.getElementById("btnPlay");
const btnAll = document.getElementById("btnAll");
const btnMuteV = document.getElementById("btnMuteV");
const btnMuteC = document.getElementById("btnMuteC");
const btnMuteAll = document.getElementById("btnMuteAll");
const scrubber = document.getElementById("scrubber");
const timeLabel = document.getElementById("timeLabel");
const volSlider = document.getElementById("volSlider");
const statusText = document.getElementById("statusText");

async function boot() {
  try {
    const res = await fetch("sonification_data.json");
    sonData = await res.json();
    canvasConc.width = sonData.width;
    canvasConc.height = sonData.height;
    canvasMotion.width = sonData.width;
    canvasMotion.height = sonData.height;
    chartCanvas.height = sonData.height * 2 + 2;

    statusText.textContent = `Ready • ${sonData.frames.length} frames @ ${sonData.fps} FPS`;
    updateUIButtons();
    requestAnimationFrame(renderLoop);
  } catch (err) {
    statusText.textContent = "Error loading sonification_data.json";
    console.error(err);
  }
}

async function startPlayback() {
  if (hasStarted) return;
  synth.init();
  if (synth.ctx.state === "suspended") {
    await synth.ctx.resume();
  }

  vidMotion.currentTime = vidConc.currentTime;
  await Promise.all([vidConc.play(), vidMotion.play()]);
  hasStarted = true;
  btnPlay.textContent = "Playing";
  btnPlay.disabled = true;
  synth.updateMixState(true);
}

function updateUIButtons() {
  btnAll.classList.toggle("active", selectedQuad === -1);
  btnMuteV.classList.toggle("muted", muteV);
  btnMuteC.classList.toggle("muted", muteC);
  btnMuteAll.classList.toggle("muted", muted);
  synth.updateMixState(hasStarted);
}

btnPlay.addEventListener("click", startPlayback);
btnAll.addEventListener("click", () => { selectedQuad = -1; updateUIButtons(); });
btnMuteV.addEventListener("click", () => { muteV = !muteV; updateUIButtons(); });
btnMuteC.addEventListener("click", () => { muteC = !muteC; updateUIButtons(); });
btnMuteAll.addEventListener("click", () => { muted = !muted; updateUIButtons(); });
volSlider.addEventListener("input", (e) => {
  masterVol = parseFloat(e.target.value);
  synth.updateMixState(hasStarted);
});

scrubber.addEventListener("mousedown", () => { isScrubbing = true; });
scrubber.addEventListener("touchstart", () => { isScrubbing = true; }, { passive: true });
scrubber.addEventListener("input", (e) => {
  const t = parseFloat(e.target.value);
  vidConc.currentTime = t;
  vidMotion.currentTime = t;
  strikeLog = [];
  lastFrameIdx = -1;
});
scrubber.addEventListener("mouseup", () => { isScrubbing = false; });
scrubber.addEventListener("touchend", () => { isScrubbing = false; });

vidConc.addEventListener("loadedmetadata", () => {
  scrubber.max = vidConc.duration || 10;
});

vidConc.addEventListener("ended", () => {
  vidConc.currentTime = 0;
  vidMotion.currentTime = 0;
  strikeLog = [];
  lastFrameIdx = -1;
  vidConc.play();
  vidMotion.play();
});

function handleMapClick(e, canvas) {
  if (!hasStarted) startPlayback();
  const rect = canvas.getBoundingClientRect();
  const nx = (e.clientX - rect.left) / rect.width;
  const ny = (e.clientY - rect.top) / rect.height;
  const col = nx < 0.5 ? 0 : 1;
  const row = ny < 0.5 ? 0 : 1;
  selectedQuad = row * 2 + col;
  updateUIButtons();
}

canvasConc.addEventListener("click", (e) => handleMapClick(e, canvasConc));
canvasMotion.addEventListener("click", (e) => handleMapClick(e, canvasMotion));

window.addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") { selectedQuad = -1; updateUIButtons(); }
  else if (e.key === "m" || e.key === "M") { muted = !muted; updateUIButtons(); }
  else if (e.key === "v" || e.key === "V") { muteV = !muteV; updateUIButtons(); }
  else if (e.key === "c" || e.key === "C") { muteC = !muteC; updateUIButtons(); }
  else if (["1", "2", "3", "4"].includes(e.key)) {
    selectedQuad = parseInt(e.key, 10) - 1;
    updateUIButtons();
  }
});

// ============================================================================
// RENDERING & AUDIO TICK LOOP
// ============================================================================
function renderLoop(nowMs) {
  const dt = Math.min(0.1, (nowMs - lastAnimTime) / 1000.0);
  lastAnimTime = nowMs;

  if (sonData) {
    const curT = vidConc.currentTime || 0;

    if (!isScrubbing) {
      scrubber.value = curT;
    }
    const mins = Math.floor(curT / 60);
    const secs = Math.floor(curT % 60).toString().padStart(2, "0");
    timeLabel.textContent = `${mins}:${secs}`;

    const frameIdx = Math.min(
      sonData.frames.length - 1,
      Math.max(0, Math.round(curT * sonData.fps))
    );
    const fData = sonData.frames[frameIdx];

    if (hasStarted && frameIdx !== lastFrameIdx) {
      if (frameIdx > lastFrameIdx && frameIdx - lastFrameIdx <= 6) {
        for (let idx = lastFrameIdx + 1; idx <= frameIdx; idx++) {
          for (const ev of sonData.frames[idx].ev) {
            synth.strikeVortex(ev);
            strikeLog.push({ t: curT, rung: ev.rung, vel: ev.vel, quad: ev.quad, decay: ev.decay });
          }
        }
      }
      lastFrameIdx = frameIdx;
    }

    while (strikeLog.length && (curT - strikeLog[0].t > ROLL_SEC || curT < strikeLog[0].t)) {
      strikeLog.shift();
    }

    const tau = SMOOTH_SEC_C / Math.sqrt(SMOOTH_STAGES);
    const alpha = 1.0 - Math.exp(-dt / tau);
    const outScale = (muted || !hasStarted ? 0.0 : masterVol) * (selectedQuad === -1 ? 0.55 : 0.85);

    for (let q = 0; q < 4; q++) {
      const gate = (selectedQuad === -1 || selectedQuad === q) ? 1.0 : 0.0;
      const gc = (muteC || !hasStarted) ? 0.0 : 1.0;
      const amp = fData.q[q].amp;

      for (let b = 0; b < N_BINS; b++) {
        const tgt = gc * amp * gate * Math.sqrt(Math.max(0, fData.q[q].conc_eff[b]));
        const rise = Math.max(0, tgt - s_c[q][b]);
        flash_c[q][b] = hasStarted
          ? Math.max(flash_c[q][b] * Math.exp(-dt / CONC_FLASH_DECAY), Math.min(1.0, rise / CONC_FLASH_SENS))
          : 0.0;

        let x = tgt;
        for (let st = 0; st < SMOOTH_STAGES; st++) {
          c_stages[st][q][b] += alpha * (x - c_stages[st][q][b]);
          x = c_stages[st][q][b];
        }
        s_c[q][b] = x;

        const lvlOut = s_c[q][b] * CONC_GAIN * PAD_NOTE_RMS * outScale;
        vu_c[q][b] = Math.max(lvlOut, vu_c[q][b] * Math.exp(-dt / VU_DECAY));
      }
    }

    synth.updatePadLevels(s_c);

    drawVideoPanel(ctxConc, vidConc, fData, false);
    drawVideoPanel(ctxMotion, vidMotion, fData, true);
    drawDashboard(ctxChart, fData, curT);
  }

  requestAnimationFrame(renderLoop);
}

function drawVideoPanel(ctx, videoEl, fData, isMotion) {
  const W = ctx.canvas.width;
  const H = ctx.canvas.height;

  if (videoEl.readyState >= 2) {
    ctx.drawImage(videoEl, 0, 0, W, H);
  } else {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
  }

  if (isMotion && selectedQuad !== -1) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
    const mw = W / 2, mh = H / 2;
    for (let q = 0; q < 4; q++) {
      if (q === selectedQuad) continue;
      const qx = (q % 2) * mw;
      const qy = Math.floor(q / 2) * mh;
      ctx.fillRect(qx, qy, mw, mh);
    }
  }

  ctx.strokeStyle = "rgba(160, 160, 160, 0.6)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H);
  ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2);
  ctx.stroke();

  ctx.font = "12px sans-serif";
  for (let q = 0; q < 4; q++) {
    const qx = (q % 2) * (W / 2);
    const qy = Math.floor(q / 2) * (H / 2);
    const isActive = (selectedQuad === -1 || selectedQuad === q);

    if (selectedQuad === q) {
      ctx.strokeStyle = "#50ffa0";
      ctx.lineWidth = 2;
      ctx.strokeRect(qx + 1, qy + 1, W / 2 - 2, H / 2 - 2);
    }

    ctx.fillStyle = isActive ? "#50ffa0" : "#777";
    ctx.fillText(QUAD_META[q].short, qx + 10, qy + 20);

    if (isMotion) {
      const bx = qx + 10, by = qy + H / 2 - 14;
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, 60, 6);
      ctx.fillStyle = isActive ? "#50ffa0" : "#777";
      ctx.fillRect(bx, by, 60 * fData.q[q].amp, 6);
    }
  }

  for (const mk of fData.mk) {
    if (selectedQuad !== -1 && mk.q !== selectedQuad) continue;
    const x = mk.x * W;
    const y = mk.y * H;
    const r = mk.r * W;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.strokeStyle = mk.aud ? "#fff" : "#787878";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    if (mk.ring >= 0 && mk.ring <= 1) {
      ctx.beginPath();
      ctx.arc(x, y, r + 30 * mk.ring, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0, 220, 255, ${1 - mk.ring})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
  ctx.fillRect(0, H - 22, W, 22);
  ctx.fillStyle = "#ddd";
  ctx.font = "11px sans-serif";
  ctx.fillText(
    isMotion ? "MOTION & CURL REGIME MAP (Vortex Instrument)" : "CO2 CONCENTRATION MAP (Pad Synthesizer)",
    10, H - 7
  );
}

// ============================================================================
// RIGHT-HAND SPECTRUM & STRIKE ROLL DASHBOARD
// ============================================================================
function drawDashboard(ctx, fData, curT) {
  const W = ctx.canvas.width;
  const H = ctx.canvas.height;
  ctx.fillStyle = "#161616";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#ebebeb";
  ctx.font = "bold 14px sans-serif";
  ctx.fillText("SONIFICATION OUTPUT & SPECTRUM", 18, 26);

  let modeTxt = selectedQuad === -1
    ? "LISTENING: ALL 4 QUADRANTS (STEREO CHORD)"
    : `SOLO AUDIO: ${QUAD_META[selectedQuad].name}`;
  let modeCol = selectedQuad === -1 ? "#00d2ff" : "#50ffa0";
  if (muted) { modeTxt += " [MUTED]"; modeCol = "#ff5a5a"; }
  else if (!hasStarted) { modeTxt += " [CLICK PLAY]"; modeCol = "#aaa"; }

  ctx.fillStyle = modeCol;
  ctx.font = "12px sans-serif";
  ctx.fillText(modeTxt, 18, 46);

  const dispStat = selectedQuad === -1 ? fData.all : fData.q[selectedQuad];
  let nTr = 0, nAud = 0;
  for (const mk of fData.mk) {
    if (selectedQuad === -1 || mk.q === selectedQuad) {
      nTr++;
      if (mk.aud) nAud++;
    }
  }

  drawGauge(ctx, 18, 60, W - 40, `Pad volume (moving area): ${Math.round(dispStat.amp * 100)}%`, dispStat.amp, "#5ae68c");
  drawGauge(ctx, 18, 80, W - 40, `Mean CO2 conc: ${dispStat.mean_conc.toFixed(2)}`, dispStat.mean_conc, "#c878ff");

  ctx.fillStyle = "#d2dce6";
  ctx.font = "11px sans-serif";
  ctx.fillText("Vortices:", 18, 110);
  ctx.fillStyle = "#ccc";
  ctx.fillText(`${nTr} tracked,`, 215, 110);
  ctx.fillStyle = nAud ? "#00e6ff" : "#888";
  ctx.fillText(`${nAud} audible`, 285, 110);

  const top = 128;
  const bot = H - 64;
  const mid = top + Math.floor((bot - top) / 2);
  const x0 = 50, x1 = W - 20;

  drawStrikeRoll(ctx, x0, x1, top, mid - 8, curT, muteV || muted);

  const outC = new Float32Array(N_BINS);
  const flC = new Float32Array(N_BINS);
  for (let b = 0; b < N_BINS; b++) {
    if (selectedQuad === -1) {
      let sumSq = 0, maxFl = 0;
      for (let q = 0; q < 4; q++) {
        sumSq += vu_c[q][b] ** 2;
        maxFl = Math.max(maxFl, flash_c[q][b]);
      }
      outC[b] = Math.sqrt(sumSq);
      flC[b] = maxFl;
    } else {
      outC[b] = vu_c[selectedQuad][b];
      flC[b] = flash_c[selectedQuad][b];
    }
  }
  const namesC = selectedQuad === -1 ? null : CONC_NAMES[selectedQuad];
  drawLevelHistogram(ctx, x0, x1, mid + 8, bot, outC, flC, namesC, muteC || muted);

  const sy0 = H - 54;
  const cardW = (W - 36 - 18) / 4;
  for (let q = 0; q < 4; q++) {
    const cx0 = 18 + q * (cardW + 6);
    const isSel = (selectedQuad === -1 || selectedQuad === q);
    ctx.fillStyle = "#222";
    ctx.fillRect(cx0, sy0, cardW, 40);
    ctx.strokeStyle = isSel ? "#50ffa0" : "#4b4b4b";
    ctx.lineWidth = selectedQuad === q ? 2 : 1;
    ctx.strokeRect(cx0, sy0, cardW, 40);

    ctx.fillStyle = isSel ? "#50ffa0" : "#888";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(QUAD_META[q].short, cx0 + 6, sy0 + 15);
    ctx.fillStyle = "#ccc";
    ctx.font = "11px sans-serif";
    ctx.fillText(`Vol:${Math.round(fData.q[q].amp * 100)}%`, cx0 + 6, sy0 + 31);
  }
}

function drawGauge(ctx, x, y, w, label, frac, color) {
  ctx.fillStyle = "#d2dce6";
  ctx.font = "11px sans-serif";
  ctx.fillText(label, x, y + 9);
  const bx0 = 215, bw = w - (bx0 - x);
  ctx.fillStyle = "#303030";
  ctx.fillRect(bx0, y, bw, 10);
  ctx.fillStyle = color;
  ctx.fillRect(bx0, y, bw * Math.min(1, Math.max(0, frac)), 10);
  ctx.strokeStyle = "#6e6e6e";
  ctx.lineWidth = 1;
  ctx.strokeRect(bx0, y, bw, 10);
}

function drawStrikeRoll(ctx, x0, x1, y0, y1, curT, dim) {
  ctx.fillStyle = dim ? "#ff5a5a" : "#d7d7d7";
  ctx.font = "11px sans-serif";
  ctx.fillText(`VORTEX STRIKES (last ${ROLL_SEC}s) • pitch: high = north [V]${dim ? " [MUTED]" : ""}`, x0, y0 + 10);

  const py0 = y0 + 18, py1 = y1 - 22;
  const plotW = x1 - x0, plotH = py1 - py0;
  const rows = RUNG_HI - RUNG_LO + 1;
  const rowH = plotH / rows;

  ctx.fillStyle = "#1e1e1e";
  ctx.fillRect(x0, py0, plotW, plotH);

  for (let r = RUNG_LO; r <= RUNG_HI; r++) {
    const yc = py1 - (r - RUNG_LO + 0.5) * rowH;
    const isC = (r % 5 === 0);
    ctx.strokeStyle = isC ? "#3e3e3e" : "#282828";
    ctx.beginPath(); ctx.moveTo(x0, yc); ctx.lineTo(x1, yc); ctx.stroke();

    if (r % 5 === 0 || r % 5 === 3) {
      ctx.fillStyle = isC ? "#aaa" : "#777";
      ctx.font = "10px sans-serif";
      ctx.fillText(ladderName(r), x0 - 30, yc + 3);
    }
  }

  for (let sec = 0; sec <= ROLL_SEC; sec += 2) {
    const xt = x1 - (sec / ROLL_SEC) * plotW;
    ctx.strokeStyle = "#2d2d2d";
    ctx.beginPath(); ctx.moveTo(xt, py0); ctx.lineTo(xt, py1); ctx.stroke();
    ctx.fillStyle = "#969696";
    ctx.font = "10px sans-serif";
    ctx.fillText(sec === 0 ? "now" : `-${sec}s`, xt - 10, py1 + 13);
  }

  for (const st of strikeLog) {
    const age = curT - st.t;
    if (age < 0 || age > ROLL_SEC || st.rung < RUNG_LO || st.rung > RUNG_HI) continue;
    const audible = !dim && (selectedQuad === -1 || st.quad === selectedQuad);
    const x = x1 - (age / ROLL_SEC) * plotW;
    const y = py1 - (st.rung - RUNG_LO + 0.5) * rowH;
    const fade = 1.0 - 0.5 * (age / ROLL_SEC);

    ctx.globalAlpha = fade;
    const col = audible ? QUAD_COLORS[st.quad] : "#555";
    const ringPx = Math.min((3.0 * st.decay / ROLL_SEC) * plotW, x1 - x);
    if (ringPx > 1) {
      ctx.strokeStyle = col;
      ctx.lineWidth = audible ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + ringPx, y); ctx.stroke();
    }

    const rad = audible ? (2 + Math.round(5 * Math.min(1, st.vel))) : 2;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();

    if (audible && age < 0.25) {
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, rad + 3, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1.0;
  }

  ctx.strokeStyle = "#8c8c8c";
  ctx.lineWidth = 1;
  ctx.strokeRect(x0, py0, plotW, plotH);
}

function drawLevelHistogram(ctx, x0, x1, y0, y1, outLevels, flash, names, dim) {
  let sumSq = 0, maxOut = 1e-12;
  for (let i = 0; i < N_BINS; i++) {
    sumSq += outLevels[i] ** 2;
    maxOut = Math.max(maxOut, outLevels[i]);
  }
  const totalDb = 20 * Math.log10(Math.max(Math.sqrt(sumSq), 1e-9));

  ctx.fillStyle = dim ? "#ff5a5a" : "#d7d7d7";
  ctx.font = "11px sans-serif";
  ctx.fillText(`CO2 PAD OUTPUT (as played) • .0 faint -> .9 dense [C]${dim ? " [MUTED]" : ""}`, x0, y0 + 10);

  ctx.fillStyle = "#aac8aa";
  ctx.fillText(`total ${totalDb < DB_MIN ? "-inf" : totalDb.toFixed(0) + " dB"}`, x1 - 74, y0 + 10);

  const py0 = y0 + 18, py1 = y1 - 28;
  const plotW = x1 - x0, plotH = py1 - py0;

  for (let db = DB_MIN; db <= DB_MAX; db += 12) {
    const yl = py1 - ((db - DB_MIN) / (DB_MAX - DB_MIN)) * plotH;
    ctx.strokeStyle = "#323232";
    ctx.beginPath(); ctx.moveTo(x0, yl); ctx.lineTo(x1, yl); ctx.stroke();
    ctx.fillStyle = "#a0a0a0";
    ctx.font = "10px sans-serif";
    ctx.fillText(`${db}`, x0 - 28, yl + 3);
  }

  const slotW = plotW / N_BINS;
  const gap = 5;

  for (let i = 0; i < N_BINS; i++) {
    const bx0 = x0 + i * slotW + gap;
    const bw = slotW - gap * 2;
    const db = 20 * Math.log10(Math.max(outLevels[i], 1e-9));
    const frac = Math.min(1, Math.max(0, (db - DB_MIN) / (DB_MAX - DB_MIN)));
    const bh = frac * plotH;
    const by0 = py1 - bh;

    const lit = !dim && (db > DB_MIN + 12) && (outLevels[i] >= LIT_REL * maxOut);
    const g = dim ? 0 : Math.min(1, Math.max(0, flash[i]));

    if (frac > 0) {
      let [r, gr, b] = VIRIDIS_STOPS[i];
      if (dim) { r *= 0.3; gr *= 0.3; b *= 0.3; }
      r = Math.round(r * (1 - GLOW * g) + 255 * GLOW * g);
      gr = Math.round(gr * (1 - GLOW * g) + 255 * GLOW * g);
      b = Math.round(b * (1 - GLOW * g) + 255 * GLOW * g);

      ctx.fillStyle = `rgb(${r},${gr},${b})`;
      ctx.fillRect(bx0, by0, bw, bh);

      ctx.strokeStyle = lit ? "#fff" : "#a0a0a0";
      ctx.lineWidth = lit ? 2 : 1;
      ctx.strokeRect(bx0, by0, bw, bh);

      if (lit) {
        ctx.fillStyle = "#e1e1e1";
        ctx.font = "10px sans-serif";
        ctx.fillText(`${db.toFixed(0)}`, bx0 + 2, Math.max(py0 + 10, by0 - 4));
      }
    }

    ctx.fillStyle = "#b4b4b4";
    ctx.font = "10px sans-serif";
    ctx.fillText(`.${i}`, bx0 + 6, py1 + 12);
    if (names) {
      ctx.fillStyle = "#8cc8ff";
      ctx.fillText(names[i], bx0 + 4, py1 + 24);
    }
  }

  ctx.strokeStyle = "#8c8c8c";
  ctx.lineWidth = 1;
  ctx.strokeRect(x0, py0, plotW, plotH);
}

boot();
</script>
